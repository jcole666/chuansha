name: chuansha
description: "穿啥 - 智能衣橱管理App"
publish_to: 'none'
version: 1.1.3+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 后端（Supabase，无需 Google 服务）
  supabase_flutter: ^2.8.1

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 路由
  go_router: ^17.3.0

  # 网络
  dio: ^5.11.0
  http: ^1.2.2

  # 图片
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2

  # 定位
  geolocator: ^14.0.3
  geocoding: ^4.0.0

  # 工具
  intl: ^0.20.3
  uuid: ^4.6.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 代码生成
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4

  # 测试
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
