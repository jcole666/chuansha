name: chuansha
description: "穿啥 - 智能衣橱管理App"
publish_to: 'none'
version: 1.1.3+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 后端（Supabase，无需 Google 服务）
  supabase_flutter: ^2.8.1

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^17.3.0

  # 网络
  http: ^1.2.2

  # 图片
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2

  # 定位
  geolocator: ^14.0.3
  geocoding: ^4.0.0

  # 工具
  intl: ^0.20.3
  uuid: ^4.6.0
  image: ^4.8.0

  # 本地持久化（引导页标记、视图偏好等）
  shared_preferences: ^2.5.5

  # 读取真实版本号（「关于」页用，别再写死）
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
